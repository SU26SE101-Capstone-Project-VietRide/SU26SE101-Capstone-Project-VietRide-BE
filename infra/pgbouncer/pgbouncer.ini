; VietRide PgBouncer — placeholder. Production-like config Day 2+.
; Pool mode = transaction per BACKEND_SOURCE_OF_TRUTH Section 1.3.

[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
pool_mode = transaction
max_client_conn = 200
default_pool_size = 25
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
ignore_startup_parameters = extra_float_digits
