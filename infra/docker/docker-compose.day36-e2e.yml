name: day36-e2e

services:
  goong-directions-mock:
    image: node:20-alpine
    container_name: day36-e2e-goong-directions-mock
    profiles: ['app']
    command:
      - node
      - -e
      - |
        const http = require('node:http');
        const send = (res, statusCode, body) => {
          res.statusCode = statusCode;
          res.setHeader('content-type', 'application/json');
          res.end(JSON.stringify(body));
        };
        http.createServer((req, res) => {
          const url = new URL(req.url, 'http://goong-directions-mock');
          if (req.method === 'GET' && url.pathname === '/health') return send(res, 200, { ok: true });
          if (req.method !== 'GET' || url.pathname !== '/Direction') {
            return send(res, 404, { error: 'not-found' });
          }
          const parsePoint = (value) => {
            const [lat, lng] = String(value || '').split(',').map(Number);
            return Number.isFinite(lat) && Number.isFinite(lng) ? { lat, lng } : null;
          };
          const origin = parsePoint(url.searchParams.get('origin'));
          const targets = String(url.searchParams.get('destination') || '')
            .split(';').filter(Boolean).map(parsePoint);
          if (!origin || targets.length === 0 || targets.some((point) => !point)) {
            return send(res, 400, { error: 'invalid-points' });
          }
          const legs = targets.map((target, index) => {
            const latitude = target.lat;
            const bucket = Math.round((latitude - 10.70) * 100);
            return {
              distance: { value: Math.max(0, 4500 - Math.max(0, Math.min(40, bucket)) * 100) },
              duration: { value: 600 },
              start_location: index === 0 ? origin : targets[index - 1],
              end_location: target,
            };
          });
          send(res, 200, { routes: [{ legs }] });
        }).listen(8080, '0.0.0.0');
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 5s

  postgres:
    container_name: day36-e2e-postgres
    ports: ['55436:5432']
  redis:
    container_name: day36-e2e-redis
    ports: ['56378:6379']
  rabbitmq:
    container_name: day36-e2e-rabbitmq
    ports: ['55662:5672', '55663:15672']
  identity:
    container_name: day36-e2e-identity
    ports: ['56001:5001']
  trip:
    container_name: day36-e2e-trip
    environment:
      Shuttle__ScanIntervalMinutes: '1'
      ROUTING_PROVIDER: GOONG
      GOONG_API_KEY: fake-day36-goong-key
      GOONG_BASE_URL: http://goong-directions-mock:8080/
      GOONG_MAX_DESTINATIONS_PER_REQUEST: 10
      TRACKING_ROUTING_TIMEOUT_MS: 5000
      TRIP_SHUTTLE_DISTANCE_TIMEOUT_MS: '5000'
    depends_on:
      goong-directions-mock:
        condition: service_healthy
    ports: ['56002:5002']
  booking:
    container_name: day36-e2e-booking
    ports: ['56003:5003']
  payment:
    container_name: day36-e2e-payment
    ports: ['56004:5004']
  parcel:
    container_name: day36-e2e-parcel
  tracking:
    container_name: day36-e2e-tracking
    environment:
      TRACKING_GPS_FLUSH_ENABLED: 'false'
      TRACKING_TRIP_DELAY_ENABLED: 'false'
      TRACKING_SHARE_TOKEN_SECRET: day36-tracking-share-token-secret-1234567890
      ROUTING_PROVIDER: GOONG
      GOONG_API_KEY: fake-day36-goong-key
      GOONG_BASE_URL: http://goong-directions-mock:8080/
      GOONG_MAX_DESTINATIONS_PER_REQUEST: 10
      TRACKING_ROUTING_TIMEOUT_MS: 5000
    depends_on:
      goong-directions-mock:
        condition: service_healthy
    ports: ['56011:3001']
  notification:
    container_name: day36-e2e-notification
    environment:
      NODE_ENV: 'development'
      FCM_PROJECT_ID: ''
      FCM_CLIENT_EMAIL: ''
      FCM_PRIVATE_KEY: ''
      FCM_DRY_RUN: 'false'
    ports: ['56012:3002']
  gateway:
    container_name: day36-e2e-gateway
    ports: ['56300:3000']

networks:
  default:
    name: day36-e2e-net
