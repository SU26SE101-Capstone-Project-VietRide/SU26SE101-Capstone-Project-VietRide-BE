name: day36-e2e

services:
  google-routes-mock:
    image: node:20-alpine
    container_name: day36-e2e-google-routes-mock
    profiles: ['app']
    command:
      - node
      - -e
      - |
        const http = require('node:http');
        const send = (res, statusCode, body) => {
          res.statusCode = statusCode;
          res.setHeader('content-type', 'application/json');
          res.end(JSON.stringify(body));
        };
        http.createServer((req, res) => {
          if (req.method === 'GET' && req.url === '/health') return send(res, 200, { ok: true });
          if (req.method !== 'POST' || req.url !== '/directions/v2:computeRoutes') {
            return send(res, 404, { error: 'not-found' });
          }
          let raw = '';
          req.setEncoding('utf8');
          req.on('data', (chunk) => { raw += chunk; });
          req.on('end', () => {
            try {
              const body = JSON.parse(raw);
              const latitude = Number(body?.destination?.location?.latLng?.latitude);
              const bucket = Number.isFinite(latitude) ? Math.round((latitude - 10.70) * 100) : 0;
              const distanceMeters = Math.max(0, 4500 - Math.max(0, Math.min(40, bucket)) * 100);
              send(res, 200, { routes: [{ distanceMeters, duration: '600s' }] });
            } catch {
              send(res, 400, { error: 'invalid-json' });
            }
          });
        }).listen(8080, '0.0.0.0');
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 5s

  postgres:
    container_name: day36-e2e-postgres
    ports: ['55436:5432']
  redis:
    container_name: day36-e2e-redis
    ports: ['56378:6379']
  rabbitmq:
    container_name: day36-e2e-rabbitmq
    ports: ['55662:5672', '55663:15672']
  identity:
    container_name: day36-e2e-identity
    ports: ['56001:5001']
  trip:
    container_name: day36-e2e-trip
    environment:
      Shuttle__ScanIntervalMinutes: '1'
      GOOGLE_ROUTES_ENABLED: 'true'
      GOOGLE_ROUTES_API_KEY: fake-day36-google-routes-key
      GOOGLE_ROUTES_BASE_URL: http://google-routes-mock:8080/
      TRIP_SHUTTLE_DISTANCE_TIMEOUT_MS: '5000'
    depends_on:
      google-routes-mock:
        condition: service_healthy
    ports: ['56002:5002']
  booking:
    container_name: day36-e2e-booking
    ports: ['56003:5003']
  payment:
    container_name: day36-e2e-payment
    ports: ['56004:5004']
  parcel:
    container_name: day36-e2e-parcel
  tracking:
    container_name: day36-e2e-tracking
    environment:
      TRACKING_GPS_FLUSH_ENABLED: 'false'
      TRACKING_TRIP_DELAY_ENABLED: 'false'
      TRACKING_SHARE_TOKEN_SECRET: day36-tracking-share-token-secret-1234567890
      GOOGLE_ROUTES_ENABLED: 'true'
      GOOGLE_ROUTES_API_KEY: fake-day36-google-routes-key
      GOOGLE_ROUTES_BASE_URL: http://google-routes-mock:8080/
      TRACKING_GOOGLE_ROUTES_TIMEOUT_MS: '5000'
    depends_on:
      google-routes-mock:
        condition: service_healthy
    ports: ['56011:3001']
  notification:
    container_name: day36-e2e-notification
    environment:
      NODE_ENV: 'development'
      FCM_PROJECT_ID: ''
      FCM_CLIENT_EMAIL: ''
      FCM_PRIVATE_KEY: ''
      FCM_DRY_RUN: 'false'
    ports: ['56012:3002']
  gateway:
    container_name: day36-e2e-gateway
    ports: ['56300:3000']

networks:
  default:
    name: day36-e2e-net
