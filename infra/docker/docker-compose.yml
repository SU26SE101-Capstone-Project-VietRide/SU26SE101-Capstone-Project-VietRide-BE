# VietRide local + production-like dev stack.
# Env: copy `.env.example` → `.env` at repo root before first run.
#
# Services are split into two Compose PROFILES so you can bring up tiers independently:
#   infra → postgres, pgbouncer, redis, rabbitmq   (long-lived backing services)
#   app   → the 9 .NET + NestJS service containers  (rebuilt often)
# The infra services belong to BOTH profiles, so the `app` tier (which depends_on them)
# always has its backing services available — enabling `app` alone pulls infra in too.
#
# Run from infra/docker (add --env-file ../../.env since .env lives at repo root):
#   docker compose --profile infra up -d    # infra ONLY (daily dev: run services in VS/nx)
#   docker compose --profile app up -d       # FULL stack (app + infra, production-like smoke test)
#   docker compose --profile app down        # tear the full stack down
# To stop just the app containers but leave infra running, stop them by name:
#   docker compose stop gateway identity trip booking payment parcel tracking notification rag
# A bare `docker compose up -d` (no --profile) starts NOTHING — pick a profile explicitly.

# Project name (Docker Desktop groups containers under this; otherwise it'd be the
# folder name "docker"). All tiers share ONE project so depends_on health gating works.
name: vietride

x-dotnet-common: &dotnet-common
  profiles: ['app']
  restart: unless-stopped
  environment:
    ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
    ConnectionStrings__Default: 'Host=postgres;Port=5432;Username=${POSTGRES_USER:-vietride};Password=${POSTGRES_PASSWORD:-vietride_dev};Database=;Maximum Pool Size=10;Minimum Pool Size=0;Connection Idle Lifetime=15'
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

x-nest-common: &nest-common
  profiles: ['app']
  restart: unless-stopped
  environment:
    NODE_ENV: ${NODE_ENV:-production}
    INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
    REDIS_HOST: redis
    REDIS_PORT: 6379
  depends_on:
    redis:
      condition: service_healthy

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vietride_postgres
    profiles: ['infra', 'app']
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vietride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vietride_dev}
      POSTGRES_DB: postgres
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vietride} -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: vietride_pgbouncer
    profiles: ['infra', 'app']
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vietride}:${POSTGRES_PASSWORD:-vietride_dev}@postgres:5432/postgres
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
    ports:
      - '${PGBOUNCER_PORT:-6432}:5432'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # pgbouncer image lacks pg_isready/psql; assert the PgBouncer process is alive.
      test: ['CMD-SHELL', 'pidof pgbouncer >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vietride_redis
    profiles: ['infra', 'app']
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: vietride_rabbitmq
    profiles: ['infra', 'app']
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-vietride}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-vietride_dev}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MGMT_PORT:-15672}:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ../rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 10s
      retries: 5

  # ── .NET 8 services ─────────────────────────────────────────────────────────
  identity:
    <<: *dotnet-common
    build:
      context: ../..
      dockerfile: apps/identity/Dockerfile
    container_name: vietride_identity
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      REDIS_URL: 'redis:6379,abortConnect=false'
      PAYMENT_SERVICE_BASE_URL: http://payment:5004
      Payment__BaseUrl: http://payment:5004
      # Real email delivery via Notification internal endpoint (POST /internal/v1/emails).
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-SENDGRID}
      EMAIL_SERVICE_BASE_URL: http://notification:3002
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      SYSTEM_ADMIN_BOOTSTRAP_EMAIL: ${SYSTEM_ADMIN_BOOTSTRAP_EMAIL}
      SYSTEM_ADMIN_BOOTSTRAP_PASSWORD: ${SYSTEM_ADMIN_BOOTSTRAP_PASSWORD}
      SYSTEM_ADMIN_BOOTSTRAP_DISPLAY_NAME: ${SYSTEM_ADMIN_BOOTSTRAP_DISPLAY_NAME:-System Administrator}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_WEB_STORAGE_BUCKET: ${FIREBASE_WEB_STORAGE_BUCKET:-}
      ConnectionStrings__Default: 'Host=postgres;Port=5432;Database=vietride_identity;Username=${POSTGRES_USER:-vietride};Password=${POSTGRES_PASSWORD:-vietride_dev};Maximum Pool Size=10;Minimum Pool Size=0;Connection Idle Lifetime=15'
      # Outbox publisher must reach the broker by its compose hostname, not localhost
      # (appsettings RabbitMq:HostName defaults to localhost for host-run dev).
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: '5672'
      RabbitMq__UserName: ${RABBITMQ_USER:-vietride}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-vietride_dev}
    ports:
      - '${IDENTITY_PORT:-5001}:5001'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:5001/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  trip:
    <<: *dotnet-common
    build:
      context: ../..
      dockerfile: apps/trip/Dockerfile
    container_name: vietride_trip
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      ConnectionStrings__Default: 'Host=postgres;Port=5432;Database=vietride_trip;Username=${POSTGRES_USER:-vietride};Password=${POSTGRES_PASSWORD:-vietride_dev};Maximum Pool Size=10;Minimum Pool Size=0;Connection Idle Lifetime=15'
      REDIS_URL: 'redis:6379,abortConnect=false'
      FIREBASE_WEB_STORAGE_BUCKET: ${FIREBASE_WEB_STORAGE_BUCKET:-}
      Identity__BaseUrl: http://identity:5001
      IDENTITY_SERVICE_BASE_URL: http://identity:5001
      BOOKING_BASE_URL: http://booking:5003
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: '5672'
      RabbitMq__UserName: ${RABBITMQ_USER:-vietride}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-vietride_dev}
      RabbitMq__ExchangeName: ${RABBITMQ_EXCHANGE:-vietride.events}
    ports:
      - '${TRIP_PORT:-5002}:5002'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:5002/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  booking:
    <<: *dotnet-common
    build:
      context: ../..
      dockerfile: apps/booking/Dockerfile
    container_name: vietride_booking
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      ConnectionStrings__Default: 'Host=postgres;Port=5432;Database=vietride_booking;Username=${POSTGRES_USER:-vietride};Password=${POSTGRES_PASSWORD:-vietride_dev};Maximum Pool Size=10;Minimum Pool Size=0;Connection Idle Lifetime=15'
      REDIS_URL: redis:6379
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: '5672'
      RabbitMq__UserName: ${RABBITMQ_USER:-vietride}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-vietride_dev}
      RabbitMq__ExchangeName: ${RABBITMQ_EXCHANGE:-vietride.events}
      TRIP_SERVICE_BASE_URL: http://trip:5002
      PAYMENT_SERVICE_BASE_URL: http://payment:5004
      PARCEL_SERVICE_BASE_URL: http://parcel:5005
      IDENTITY_SERVICE_BASE_URL: http://identity:5001
      # appsettings.json hard-codes Trip/Payment/Identity:BaseUrl = localhost (dev outside Docker);
      # override the config keys so the in-container clients reach the sibling services.
      Trip__BaseUrl: http://trip:5002
      Payment__BaseUrl: http://payment:5004
      Parcel__BaseUrl: http://parcel:5005
      Identity__BaseUrl: http://identity:5001
      # Real cross-service seam by default (overrides appsettings.Development.json UseDevStub=true).
      # Set BOOKING_TRIP_USE_DEV_STUB / BOOKING_PAYMENT_USE_DEV_STUB / BOOKING_IDENTITY_USE_DEV_STUB =true locally to use the dev stubs.
      Trip__UseDevStub: '${BOOKING_TRIP_USE_DEV_STUB:-false}'
      Payment__UseDevStub: '${BOOKING_PAYMENT_USE_DEV_STUB:-false}'
      Identity__UseDevStub: '${BOOKING_IDENTITY_USE_DEV_STUB:-false}'
      Hangfire__SchemaName: hangfire
      Hangfire__QueueName: booking
      Hangfire__WorkerCount: '${BOOKING_HANGFIRE_WORKER_COUNT:-2}'
    ports:
      - '${BOOKING_PORT:-5003}:5003'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:5003/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  payment:
    <<: *dotnet-common
    build:
      context: ../..
      dockerfile: apps/payment/Dockerfile
    container_name: vietride_payment
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      ConnectionStrings__Default: 'Host=postgres;Port=5432;Database=vietride_payment;Username=${POSTGRES_USER:-vietride};Password=${POSTGRES_PASSWORD:-vietride_dev};Search Path=vietride_payment,public;Maximum Pool Size=10;Minimum Pool Size=0;Connection Idle Lifetime=15'
      REDIS_URL: redis:6379
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: '5672'
      RabbitMq__UserName: ${RABBITMQ_USER:-vietride}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-vietride_dev}
      RabbitMq__ExchangeName: ${RABBITMQ_EXCHANGE:-vietride.events}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_BASE_URL: ${VNPAY_BASE_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-https://app.vietride.online/payments/return}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-https://api.vietride.online/v1/payments/vnpay-ipn}
      VNPAY_PAYMENT_TIMEOUT_MINUTES: ${VNPAY_PAYMENT_TIMEOUT_MINUTES:-10}
      BOOKING_SERVICE_BASE_URL: http://booking:5003
      PARCEL_SERVICE_BASE_URL: http://parcel:5005
      Booking__BaseUrl: http://booking:5003
      Parcel__BaseUrl: http://parcel:5005
      InvoiceStorage__Bucket: ${INVOICE_STORAGE_BUCKET:-}
      InvoiceStorage__StableBaseUrl: ${INVOICE_STORAGE_STABLE_BASE_URL:-http://gateway:3000}
      OperatorWeb__InvoiceDetailBaseUrl: ${OPERATOR_WEB_INVOICE_DETAIL_BASE_URL:-http://localhost:5173/operator/invoices}
      # ADC path may point to a read-only file mounted by a developer-specific compose override.
      # Production uses workload identity or an external secret mount; no credential is in this file.
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    ports:
      - '${PAYMENT_PORT:-5004}:5004'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:5004/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  parcel:
    <<: *dotnet-common
    build:
      context: ../..
      dockerfile: apps/parcel/Dockerfile
    container_name: vietride_parcel
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      ConnectionStrings__Default: 'Host=postgres;Port=5432;Database=vietride_parcel;Username=${POSTGRES_USER:-vietride};Password=${POSTGRES_PASSWORD:-vietride_dev};Maximum Pool Size=10;Minimum Pool Size=0;Connection Idle Lifetime=15'
      REDIS_URL: redis:6379
      FIREBASE_WEB_STORAGE_BUCKET: ${FIREBASE_WEB_STORAGE_BUCKET:-}
      Trip__BaseUrl: http://trip:5002
      Payment__BaseUrl: http://payment:5004
      Booking__BaseUrl: http://booking:5003
      Identity__BaseUrl: http://identity:5001
      Notification__BaseUrl: http://notification:3002
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: '5672'
      RabbitMq__UserName: ${RABBITMQ_USER:-vietride}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-vietride_dev}
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-/}
    ports:
      - '${PARCEL_PORT:-5005}:5005'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:5005/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── NestJS services ─────────────────────────────────────────────────────────
  gateway:
    <<: *nest-common
    build:
      context: ../..
      dockerfile: apps/gateway/Dockerfile
    container_name: vietride_gateway
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GATEWAY_PORT: 3000
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      JWT_PUBLIC_KEY_URL: http://identity:5001/v1/.well-known/jwks.json
      IDENTITY_BASE_URL: http://identity:5001
      TRIP_BASE_URL: http://trip:5002
      BOOKING_BASE_URL: http://booking:5003
      PAYMENT_BASE_URL: http://payment:5004
      PARCEL_BASE_URL: http://parcel:5005
      TRACKING_BASE_URL: http://tracking:3001
      NOTIFICATION_BASE_URL: http://notification:3002
      RAG_BASE_URL: http://rag:3003
      REDIS_HOST: redis
      # Deep link (Android App Links) — optional; empty = endpoints return 404.
      DEEPLINK_ANDROID_PACKAGE: ${DEEPLINK_ANDROID_PACKAGE:-}
      APP_DEEP_LINK: ${APP_DEEP_LINK:-vietride://payments/return}
      ANDROID_PACKAGE: ${ANDROID_PACKAGE:-com.vietride.passenger}
      DEEPLINK_ANDROID_SHA256_FINGERPRINTS: ${DEEPLINK_ANDROID_SHA256_FINGERPRINTS:-}
      DEEPLINK_APP_SCHEME: ${DEEPLINK_APP_SCHEME:-vietride}
      DEEPLINK_ANDROID_STORE_URL: ${DEEPLINK_ANDROID_STORE_URL:-}
    ports:
      - '${GATEWAY_PORT:-3000}:3000'
    depends_on:
      identity:
        condition: service_healthy
      trip:
        condition: service_healthy
      booking:
        condition: service_healthy
      payment:
        condition: service_healthy
      parcel:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Gateway binds IPv4 (0.0.0.0) only; `localhost` resolves to ::1 (IPv6) → refused.
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  tracking:
    <<: *nest-common
    build:
      context: ../..
      dockerfile: apps/tracking/Dockerfile
    container_name: vietride_tracking
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-vietride}:${POSTGRES_PASSWORD:-vietride_dev}@postgres:5432/${TRACKING_DB:-vietride_tracking}'
      TRACKING_DATABASE_URL: 'postgresql://${POSTGRES_USER:-vietride}:${POSTGRES_PASSWORD:-vietride_dev}@postgres:5432/${TRACKING_DB:-vietride_tracking}'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: 'amqp://${RABBITMQ_USER:-vietride}:${RABBITMQ_PASSWORD:-vietride_dev}@rabbitmq:5672'
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-vietride.events}
      # main.ts crashes in production NODE_ENV when CORS origin is '*' (default).
      # Restrict it so the Socket.IO CORS adapter boots; override via .env for real FE origin.
      TRACKING_CORS_ORIGIN: ${TRACKING_CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - '${TRACKING_PORT:-3001}:3001'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  notification:
    <<: *nest-common
    build:
      context: ../..
      dockerfile: apps/notification/Dockerfile
    container_name: vietride_notification
    environment:
      # Local compose is development by default; docker-compose.prod.yml is the production boundary.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      SENTRY_DSN: ${SENTRY_DSN:-}
      TRIP_INTERNAL_BASE_URL: http://trip:5002
      BOOKING_INTERNAL_BASE_URL: http://booking:5003
      PARCEL_INTERNAL_BASE_URL: http://parcel:5005
      # SendGrid delivery (apps/notification). Without these the email-send worker
      # degrades to SENDGRID_NOT_CONFIGURED and marks deliveries FAILED.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@vietride.app}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-VietRide}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
      FCM_DRY_RUN: ${FCM_DRY_RUN:-false}
      FCM_DRY_RUN_TOPIC: ${FCM_DRY_RUN_TOPIC:-vietride-e2e-validation}
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-vietride}:${POSTGRES_PASSWORD:-vietride_dev}@postgres:5432/${NOTIFICATION_DB:-vietride_notification}'
      NOTIFICATION_DATABASE_URL: 'postgresql://${POSTGRES_USER:-vietride}:${POSTGRES_PASSWORD:-vietride_dev}@postgres:5432/${NOTIFICATION_DB:-vietride_notification}'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: ${RABBITMQ_USER:-vietride}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-vietride_dev}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-vietride.events}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - '${NOTIFICATION_PORT:-3002}:3002'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3002/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  rag:
    <<: *nest-common
    build:
      context: ../..
      dockerfile: apps/rag/Dockerfile
    container_name: vietride_rag
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3003
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-vietride}:${POSTGRES_PASSWORD:-vietride_dev}@postgres:5432/${RAG_DB:-vietride_rag}'
      RAG_DATABASE_URL: 'postgresql://${POSTGRES_USER:-vietride}:${POSTGRES_PASSWORD:-vietride_dev}@postgres:5432/${RAG_DB:-vietride_rag}'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: 'amqp://${RABBITMQ_USER:-vietride}:${RABBITMQ_PASSWORD:-vietride_dev}@rabbitmq:5672'
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-vietride.events}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-nvidia/llama-nemotron-embed-vl-1b-v2:free}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-http://localhost:3000}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-VietRide RAG}
      OPENROUTER_ALLOW_PAID_FALLBACK: ${OPENROUTER_ALLOW_PAID_FALLBACK:-false}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-auto}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_RAG_FOLDER: ${CLOUDINARY_RAG_FOLDER:-rag/documents}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - '${RAG_PORT:-3003}:3003'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3003/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

