# VietRide PRODUCTION stack — runs on the Ubuntu server.
# Unlike docker-compose.yml (which BUILDS from source for local dev), this file PULLS
# pre-built images from GHCR that the "Docker Build & Push" workflow published.
#
# This file is copied to /opt/vietride/ on the server by the deploy workflow.
# A gitignored .env (real secrets) must live next to it at /opt/vietride/.env.
#
# Required .env keys (beyond .env.example): IMAGE_PREFIX, IMAGE_TAG, APP_DOMAIN, ACME_EMAIL,
# INVOICE_STORAGE_BUCKET and OPERATOR_WEB_INVOICE_DETAIL_BASE_URL.
#   IMAGE_PREFIX  e.g. ghcr.io/su26se101-capstone-project-vietride/vietride
#   IMAGE_TAG     e.g. v1.0.0  (the version tag you pushed)
#
# The frontend is NOT part of this file — it runs as its own compose project that
# attaches to vietride_net. See the note above the nginx service.
#
# Usage on the server (the deploy workflow runs these for you):
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# NOTE: tracking / notification / rag (NestJS) are commented out until their images
# are published by docker-build.yml. Uncomment the blocks + their gateway *_BASE_URL
# wiring once the BE for those services is ready.

name: vietride

x-dotnet-common: &dotnet-common
  restart: unless-stopped
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    # pgvector image (Debian-based, same PG16 major) ships the `vector` extension that
    # the rag service's baseline migration requires (halfvec/pgvector). Same major
    # version as the previous postgres:16-alpine, so the existing data volume is reused.
    image: pgvector/pgvector:pg16
    container_name: vietride_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vietride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in prod}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Bind to 127.0.0.1 ONLY — reachable from the server itself (and via SSH tunnel for
    # Navicat/DBeaver), but NOT exposed to the internet.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vietride} -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: vietride_pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vietride}:${POSTGRES_PASSWORD}@postgres:5432/postgres
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pidof pgbouncer >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vietride_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: vietride_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-vietride}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required in prod}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ../rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 10s
      retries: 5

  # ── .NET 8 services (pulled from GHCR) ──────────────────────────────────────
  identity:
    <<: *dotnet-common
    image: ${IMAGE_PREFIX}-identity:${IMAGE_TAG:-latest}
    container_name: vietride_identity
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      REDIS_URL: 'redis:6379,abortConnect=false'
      PAYMENT_SERVICE_BASE_URL: http://payment:5004
      Payment__BaseUrl: http://payment:5004
      # Non-OTP transactional emails (including set-initial-password links) must
      # be delivered by Notification -> SendGrid in production, never log-only.
      EMAIL_PROVIDER: SENDGRID
      EMAIL_SERVICE_BASE_URL: http://notification:3002
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required in production}
      SYSTEM_ADMIN_BOOTSTRAP_EMAIL: ${SYSTEM_ADMIN_BOOTSTRAP_EMAIL}
      SYSTEM_ADMIN_BOOTSTRAP_PASSWORD: ${SYSTEM_ADMIN_BOOTSTRAP_PASSWORD}
      SYSTEM_ADMIN_BOOTSTRAP_DISPLAY_NAME: ${SYSTEM_ADMIN_BOOTSTRAP_DISPLAY_NAME:-System Administrator}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      # Identity mints Firebase custom tokens (operator web sign-in) and revokes
      # Firebase sessions on lock/suspend. AddInfrastructure THROWS on boot in
      # Production when these are unset, so `:?` fails the deploy at `compose config`
      # instead of leaving the container in a crash loop.
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID is required in production}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:?FIREBASE_CLIENT_EMAIL is required in production}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:?FIREBASE_PRIVATE_KEY is required in production}
      FIREBASE_WEB_STORAGE_BUCKET: ${FIREBASE_WEB_STORAGE_BUCKET:?FIREBASE_WEB_STORAGE_BUCKET is required in production}
      ConnectionStrings__Default: 'Host=postgres;Port=5432;Database=vietride_identity;Username=${POSTGRES_USER:-vietride};Password=${POSTGRES_PASSWORD}'
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: '5672'
      RabbitMq__UserName: ${RABBITMQ_USER:-vietride}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:5001/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  trip:
    <<: *dotnet-common
    image: ${IMAGE_PREFIX}-trip:${IMAGE_TAG:-latest}
    container_name: vietride_trip
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      ConnectionStrings__Default: 'Host=postgres;Port=5432;Database=vietride_trip;Username=${POSTGRES_USER:-vietride};Password=${POSTGRES_PASSWORD}'
      REDIS_URL: 'redis:6379,abortConnect=false'
      FIREBASE_WEB_STORAGE_BUCKET: ${FIREBASE_WEB_STORAGE_BUCKET:?FIREBASE_WEB_STORAGE_BUCKET is required in production}
      IDENTITY_SERVICE_BASE_URL: http://identity:5001
      BOOKING_BASE_URL: http://booking:5003
      # Trip runs the outbox publisher and RabbitMQ consumers. Inside Docker it
      # must use the Compose service hostname, never the localhost fallback.
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: '5672'
      RabbitMq__UserName: ${RABBITMQ_USER:-vietride}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__ExchangeName: ${RABBITMQ_EXCHANGE:-vietride.events}
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:5002/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  booking:
    <<: *dotnet-common
    image: ${IMAGE_PREFIX}-booking:${IMAGE_TAG:-latest}
    container_name: vietride_booking
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      ConnectionStrings__Default: 'Host=postgres;Port=5432;Database=vietride_booking;Username=${POSTGRES_USER:-vietride};Password=${POSTGRES_PASSWORD};Search Path=vietride_booking,public'
      REDIS_URL: redis:6379
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: '5672'
      RabbitMq__UserName: ${RABBITMQ_USER:-vietride}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__ExchangeName: ${RABBITMQ_EXCHANGE:-vietride.events}
      TRIP_SERVICE_BASE_URL: http://trip:5002
      PAYMENT_SERVICE_BASE_URL: http://payment:5004
      IDENTITY_SERVICE_BASE_URL: http://identity:5001
      # appsettings.json carries localhost defaults for running outside Docker. Override the
      # hierarchical keys too because IConfiguration resolves them before the env fallbacks.
      Trip__BaseUrl: http://trip:5002
      Payment__BaseUrl: http://payment:5004
      Identity__BaseUrl: http://identity:5001
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:5003/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  payment:
    <<: *dotnet-common
    image: ${IMAGE_PREFIX}-payment:${IMAGE_TAG:-latest}
    container_name: vietride_payment
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      # Search Path is REQUIRED: payment's outbox queries reference the
      # `outbox_event_status` enum unqualified, which lives in the vietride_payment schema.
      ConnectionStrings__Default: 'Host=postgres;Port=5432;Database=vietride_payment;Username=${POSTGRES_USER:-vietride};Password=${POSTGRES_PASSWORD};Search Path=vietride_payment,public'
      REDIS_URL: redis:6379
      # Payment runs the outbox publisher + RabbitMQ consumers — without these it dials
      # the default localhost:5672 and crashes the host on boot (BrokerUnreachable).
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: '5672'
      RabbitMq__UserName: ${RABBITMQ_USER:-vietride}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__ExchangeName: ${RABBITMQ_EXCHANGE:-vietride.events}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:?VNPAY_TMN_CODE is required}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:?VNPAY_HASH_SECRET is required}
      VNPAY_BASE_URL: ${VNPAY_BASE_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL}
      InvoiceStorage__Bucket: ${INVOICE_STORAGE_BUCKET:?INVOICE_STORAGE_BUCKET is required in production}
      InvoiceStorage__StableBaseUrl: ${INVOICE_STORAGE_STABLE_BASE_URL:?INVOICE_STORAGE_STABLE_BASE_URL is required in production}
      OperatorWeb__InvoiceDetailBaseUrl: ${OPERATOR_WEB_INVOICE_DETAIL_BASE_URL:?OPERATOR_WEB_INVOICE_DETAIL_BASE_URL is required in production}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase/service-account.json
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-https://api.vietride.online/v1/payments/vnpay-ipn}
      VNPAY_PAYMENT_TIMEOUT_MINUTES: ${VNPAY_PAYMENT_TIMEOUT_MINUTES:-10}
    volumes:
      - /opt/vietride/secrets/firebase-service-account.json:/run/secrets/firebase/service-account.json:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:5004/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  parcel:
    <<: *dotnet-common
    image: ${IMAGE_PREFIX}-parcel:${IMAGE_TAG:-latest}
    container_name: vietride_parcel
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      FIREBASE_WEB_STORAGE_BUCKET: ${FIREBASE_WEB_STORAGE_BUCKET:?FIREBASE_WEB_STORAGE_BUCKET is required in production}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      ConnectionStrings__Default: 'Host=postgres;Port=5432;Database=vietride_parcel;Username=${POSTGRES_USER:-vietride};Password=${POSTGRES_PASSWORD};Search Path=vietride_parcel,public'
      REDIS_URL: redis:6379
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: '5672'
      RabbitMq__UserName: ${RABBITMQ_USER:-vietride}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__ExchangeName: ${RABBITMQ_EXCHANGE:-vietride.events}
      TRIP_SERVICE_BASE_URL: http://trip:5002
      PAYMENT_SERVICE_BASE_URL: http://payment:5004
      BOOKING_SERVICE_BASE_URL: http://booking:5003
      IDENTITY_SERVICE_BASE_URL: http://identity:5001
      # appsettings.json carries localhost defaults for running outside Docker. Override the
      # hierarchical keys too because IConfiguration resolves them before the env fallbacks.
      Trip__BaseUrl: http://trip:5002
      Payment__BaseUrl: http://payment:5004
      Booking__BaseUrl: http://booking:5003
      Identity__BaseUrl: http://identity:5001
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:5005/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── NestJS gateway (pulled from GHCR) ───────────────────────────────────────
  gateway:
    image: ${IMAGE_PREFIX}-gateway:${IMAGE_TAG:-latest}
    container_name: vietride_gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3000
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      JWT_PUBLIC_KEY_URL: http://identity:5001/v1/.well-known/jwks.json
      IDENTITY_BASE_URL: http://identity:5001
      TRIP_BASE_URL: http://trip:5002
      BOOKING_BASE_URL: http://booking:5003
      PAYMENT_BASE_URL: http://payment:5004
      PARCEL_BASE_URL: http://parcel:5005
      TRACKING_BASE_URL: http://tracking:3001
      NOTIFICATION_BASE_URL: http://notification:3002
      RAG_BASE_URL: http://rag:3003
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Deep link (Android App Links) — optional; empty = endpoints return 404.
      DEEPLINK_ANDROID_PACKAGE: ${DEEPLINK_ANDROID_PACKAGE:-}
      APP_DEEP_LINK: ${APP_DEEP_LINK:-vietride://payments/return}
      ANDROID_PACKAGE: ${ANDROID_PACKAGE:-com.vietride.passenger}
      DEEPLINK_ANDROID_SHA256_FINGERPRINTS: ${DEEPLINK_ANDROID_SHA256_FINGERPRINTS:-}
      DEEPLINK_APP_SCHEME: ${DEEPLINK_APP_SCHEME:-vietride}
      DEEPLINK_ANDROID_STORE_URL: ${DEEPLINK_ANDROID_STORE_URL:-}
    depends_on:
      identity:
        condition: service_healthy
      trip:
        condition: service_healthy
      booking:
        condition: service_healthy
      payment:
        condition: service_healthy
      parcel:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── NestJS Prisma services ──────────────────────────────────────────────────
  tracking:
    image: ${IMAGE_PREFIX}-tracking:${IMAGE_TAG:-latest}
    container_name: vietride_tracking
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-vietride}:${POSTGRES_PASSWORD}@postgres:5432/${TRACKING_DB:-vietride_tracking}'
      TRACKING_DATABASE_URL: 'postgresql://${POSTGRES_USER:-vietride}:${POSTGRES_PASSWORD}@postgres:5432/${TRACKING_DB:-vietride_tracking}'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: 'amqp://${RABBITMQ_USER:-vietride}:${RABBITMQ_PASSWORD}@rabbitmq:5672'
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-vietride.events}
      # CORS — restrict to FE domain in production. Default '*' allows all origins.
      TRACKING_CORS_ORIGIN: ${TRACKING_CORS_ORIGIN:?TRACKING_CORS_ORIGIN is required in production}
      TRACKING_SWAGGER_ENABLED: 'false'
      # Worker flags — default false in code, must be true in production
      TRACKING_GPS_FLUSH_ENABLED: 'true'
      TRACKING_TRIP_DELAY_ENABLED: 'true'
      TRACKING_OUTBOX_PUBLISH_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  notification:
    image: ${IMAGE_PREFIX}-notification:${IMAGE_TAG:-latest}
    container_name: vietride_notification
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-vietride}:${POSTGRES_PASSWORD}@postgres:5432/${NOTIFICATION_DB:-vietride_notification}'
      NOTIFICATION_DATABASE_URL: 'postgresql://${POSTGRES_USER:-vietride}:${POSTGRES_PASSWORD}@postgres:5432/${NOTIFICATION_DB:-vietride_notification}'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: 'amqp://${RABBITMQ_USER:-vietride}:${RABBITMQ_PASSWORD}@rabbitmq:5672'
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-vietride.events}
      # Optional — push (FCM) + email (SendGrid). Left unset, the service stays healthy
      # but those deliveries are skipped. Add the keys to /opt/vietride/.env to enable.
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:?FCM_PROJECT_ID is required in production}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:?FCM_CLIENT_EMAIL is required in production}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:?FCM_PRIVATE_KEY is required in production}
      # Do NOT set FCM_DRY_RUN here: the env schema uses z.coerce.boolean(), which turns the
      # STRING "false" into boolean true (any non-empty string is truthy) → the production
      # guard then rejects it ("FCM_DRY_RUN must be false in production"). Omitting it lets the
      # schema default to real boolean false, which is what production wants.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:?SENDGRID_API_KEY is required in production}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:?SENDGRID_FROM_EMAIL is required in production}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-VietRide}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3002/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # rag REQUIRES OPENROUTER_API_KEY + CLOUDINARY_* in /opt/vietride/.env — it crashes on
  # boot without them (env schema marks them required). Its baseline Prisma migration
  # creates the pgvector `vector` extension, which is why postgres uses the pgvector image.
  rag:
    image: ${IMAGE_PREFIX}-rag:${IMAGE_TAG:-latest}
    container_name: vietride_rag
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-vietride}:${POSTGRES_PASSWORD}@postgres:5432/${RAG_DB:-vietride_rag}'
      RAG_DATABASE_URL: 'postgresql://${POSTGRES_USER:-vietride}:${POSTGRES_PASSWORD}@postgres:5432/${RAG_DB:-vietride_rag}'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: 'amqp://${RABBITMQ_USER:-vietride}:${RABBITMQ_PASSWORD}@rabbitmq:5672'
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-vietride.events}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-nvidia/llama-nemotron-embed-vl-1b-v2:free}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-VietRide RAG}
      OPENROUTER_ALLOW_PAID_FALLBACK: ${OPENROUTER_ALLOW_PAID_FALLBACK:-false}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-auto}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_RAG_FOLDER: ${CLOUDINARY_RAG_FOLDER:-rag/documents}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3003/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── Frontend: NOT declared here, on purpose ─────────────────────────────────
  # The operator web lives in a separate repo and ships on its own cadence, so it
  # runs as its own compose project (`vietride-frontend`) that attaches to this
  # stack's network. Its compose file lives in the FE repo.
  #
  # Declaring it here instead would couple the two deploys in both directions:
  #   - this stack's `docker compose pull` pulls EVERY service, so a missing or
  #     broken FE image would abort a backend deploy that has nothing to do with it;
  #   - `up -d --remove-orphans` here could recreate or drop the FE container.
  # Keeping it out means a backend deploy never touches the frontend, and vice
  # versa. nginx finds it over vietride_net by the `frontend` alias, re-resolved
  # per request, so either side can redeploy independently.

  # ── Edge: Nginx (internal reverse proxy — NO host port) ─────────────────────
  # Not published to the host. Cloudflare Tunnel reaches it over the docker network
  # (cloudflared → nginx:80). nginx terminates plain HTTP; TLS is handled at Cloudflare's
  # edge, so no certs live here. nginx does the path routing (/ → FE, /v1/ → gateway).
  nginx:
    image: nginx:1.27-alpine
    container_name: vietride_nginx
    restart: unless-stopped
    volumes:
      - ../nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5

  # ── Adminer: web DB UI for the team ─────────────────────────────────────────
  # NOT published to the host. Reached only via Cloudflare Tunnel (db.vietride.online)
  # which MUST be locked behind Cloudflare Access (email allowlist) — see DEPLOY.md.
  # Team logs in with the postgres credentials (server=postgres, user=vietride).
  adminer:
    image: adminer:latest
    container_name: vietride_adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # ── Docker socket proxy: read-only slice of the Docker API for dozzle ───────
  # dozzle must NOT mount /var/run/docker.sock directly — that socket is root on the host
  # even when mounted :ro (it can create a privileged container). This proxy re-exposes only
  # the endpoints dozzle needs (list containers, stream logs, watch events) and hard-blocks
  # every write: POST=0 means no create/exec/start/stop can reach the daemon. Not published
  # to the host; only reachable on vietride_net.
  dockerproxy:
    image: tecnativa/docker-socket-proxy:0.3
    container_name: vietride_dockerproxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1 # /containers/json + /containers/{id}/logs — what dozzle reads
      INFO: 1
      EVENTS: 1 # live container start/stop so the dozzle sidebar stays current
      PING: 1
      VERSION: 1
      POST: 0 # blocks EVERY write verb — this is the line that makes the mount safe
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ── Dozzle: read-only web log viewer for the BE team ────────────────────────
  # Lets BE read production logs WITHOUT an SSH account on the server. No shell, no restart
  # button — dozzle can only tail/search logs of the containers the proxy lets it see.
  #
  # NOT published to the host. Reached only via Cloudflare Tunnel (logs.vietride.online),
  # which MUST be locked behind Cloudflare Access (email allowlist) — see DEPLOY.md Part E.
  # Without that Access policy the hostname is PUBLIC and production logs (which contain
  # request payloads, emails, tokens) are readable by anyone who guesses the subdomain.
  #
  # DOZZLE_FILTER is the second half of the isolation: the Docker daemon also runs the
  # server owner's unrelated personal containers, and without this filter dozzle would list
  # them all. `name=vietride_` restricts it to this stack's containers (all are named
  # vietride_*). Keep the filter in sync if container_name conventions ever change.
  dozzle:
    image: amir20/dozzle:v10.6
    container_name: vietride_dozzle
    restart: unless-stopped
    environment:
      DOZZLE_REMOTE_HOST: tcp://dockerproxy:2375
      DOZZLE_FILTER: name=vietride_
      DOZZLE_NO_ANALYTICS: 'true'
    depends_on:
      - dockerproxy

  # ── Cloudflare Tunnel: outbound-only link to the Cloudflare edge ────────────
  # The server DIALS OUT to Cloudflare — no inbound port forwarding needed (works
  # behind the provider NAT / the 24450–24460 restriction). Cloudflare serves 443
  # publicly for api.vietride.online and routes requests through this tunnel to nginx:80.
  # Map the hostname → http://nginx:80 in the Cloudflare Zero Trust dashboard (or
  # config.yml) when you create the tunnel — see DEPLOY.md.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vietride_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN required — create the tunnel first, see DEPLOY.md}
    # Lets the tunnel reach the HOST's sshd (host.docker.internal → host-gateway) so the
    # ssh.<domain> public hostname can target ssh://host.docker.internal:22. The DB hostname
    # targets tcp://postgres:5432 directly over vietride_net and needs none of this.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      nginx:
        condition: service_healthy

networks:
  default:
    name: vietride_net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
