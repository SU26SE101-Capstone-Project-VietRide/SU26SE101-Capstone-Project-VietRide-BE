name: notification-idempotency-e2e

services:
  postgres:
    container_name: notification-idem-e2e-postgres
    healthcheck: &fast-healthcheck
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 5s

  redis:
    container_name: notification-idem-e2e-redis
    healthcheck: *fast-healthcheck

  rabbitmq:
    container_name: notification-idem-e2e-rabbitmq

  identity-mock:
    image: node:20-alpine
    container_name: notification-idem-e2e-identity-mock
    profiles: ['app']
    environment:
      E2E_USER_ID: 11111111-1111-4111-8111-111111111111
      E2E_OPERATOR_ID: 22222222-2222-4222-8222-222222222222
      E2E_SYSTEM_ADMIN_ID: 44444444-4444-4444-8444-444444444444
      E2E_DRIVER_ID: 55555555-5555-4555-8555-555555555555
      E2E_ASSISTANT_ID: 66666666-6666-4666-8666-666666666666
      E2E_PASSENGER_ID: 77777777-7777-4777-8777-777777777777
      E2E_TRIP_ID: 88888888-8888-4888-8888-888888888888
      E2E_BOOKING_ID: 99999999-9999-4999-8999-999999999999
      E2E_PARCEL_ID: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
      E2E_SENDER_ID: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
      E2E_RECIPIENT_ID: cccccccc-cccc-4ccc-8ccc-cccccccccccc
      E2E_JWKS_JSON: ${NOTIFICATION_E2E_JWKS_JSON:-{"keys":[]}}
    command:
      - node
      - -e
      - |
        const http = require('node:http');
        const userId = process.env.E2E_USER_ID;
        const operatorId = process.env.E2E_OPERATOR_ID;
        const systemAdminId = process.env.E2E_SYSTEM_ADMIN_ID;
        const driverId = process.env.E2E_DRIVER_ID;
        const assistantId = process.env.E2E_ASSISTANT_ID;
        const passengerId = process.env.E2E_PASSENGER_ID;
        const tripId = process.env.E2E_TRIP_ID;
        const bookingId = process.env.E2E_BOOKING_ID;
        const parcelId = process.env.E2E_PARCEL_ID;
        const senderId = process.env.E2E_SENDER_ID;
        const recipientId = process.env.E2E_RECIPIENT_ID;
        const jwks = process.env.E2E_JWKS_JSON || '{"keys":[]}';
        http.createServer((req, res) => {
          res.setHeader('content-type', 'application/json');
          if (req.url === '/health') return res.end('{"ok":true}');
          if (req.url === '/v1/.well-known/jwks.json') return res.end(jwks);
          if (req.url === '/internal/v1/operators/' + operatorId + '/recipient-users')
            return res.end(JSON.stringify([userId]));
          if (req.url?.startsWith('/internal/v1/operators/') && req.url.endsWith('/recipient-users')) {
            res.statusCode = 503;
            return res.end('{"error":"operator-recipient-unavailable"}');
          }
          if (req.url === '/internal/v1/users/system-admin-recipient-ids')
            return res.end(JSON.stringify([systemAdminId]));
          if (req.url?.startsWith('/internal/v1/users?'))
            return res.end(JSON.stringify([{ id: userId, email: 'operator@e2e.local', role: 'OPERATOR_ADMIN', status: 'ACTIVE', operatorId }]));
          if (req.url?.startsWith('/internal/v1/users/') && req.url.endsWith('/device-tokens'))
            return res.end(JSON.stringify([{ fcmToken: 'notification-e2e-token', platform: 'ANDROID' }]));
          if (req.url === '/internal/v1/trips/' + tripId)
            return res.end(JSON.stringify({ operatorId, driverUserId: driverId, assistantUserId: assistantId }));
          if (req.url === '/internal/v1/bookings/trips/' + tripId + '/notification-recipients')
            return res.end(JSON.stringify({ tripId, recipients: [{ bookingId, userId: passengerId, status: 'CONFIRMED' }] }));
          if (req.url === '/internal/v1/parcels/' + parcelId)
            return res.end(JSON.stringify({ success: true, statusCode: 200, data: { parcelId, tripId, status: 'PENDING_REVIEW', senderUserId: senderId, recipientUserId: recipientId, operatorId, dropoffStopId: null }, meta: {} }));
          res.statusCode = 404;
          res.end('{"error":"not-found"}');
        }).listen(8080, '0.0.0.0');
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      <<: *fast-healthcheck

  notification:
    container_name: notification-idem-e2e-service
    environment:
      NODE_ENV: development
      IDENTITY_INTERNAL_BASE_URL: http://identity-mock:8080
      TRIP_INTERNAL_BASE_URL: http://identity-mock:8080
      BOOKING_INTERNAL_BASE_URL: http://identity-mock:8080
      PARCEL_INTERNAL_BASE_URL: http://identity-mock:8080
      JWT_PUBLIC_KEY_URL: http://identity-mock:8080/v1/.well-known/jwks.json
      SENDGRID_API_KEY: ''
      FCM_PROJECT_ID: ''
      FCM_CLIENT_EMAIL: ''
      FCM_PRIVATE_KEY: ''
      FCM_DRY_RUN: 'false'
      NOTIFICATION_RETENTION_JOB_INTERVAL_MS: '86400000'
    depends_on:
      identity-mock:
        condition: service_healthy
    healthcheck: *fast-healthcheck

  gateway:
    container_name: notification-idem-e2e-gateway
    environment:
      NODE_ENV: development
      JWT_PUBLIC_KEY_URL: http://identity-mock:8080/v1/.well-known/jwks.json
      IDENTITY_BASE_URL: http://identity-mock:8080
      NOTIFICATION_BASE_URL: http://notification:3002
    healthcheck: *fast-healthcheck

networks:
  default:
    name: notification-idem-e2e-net
