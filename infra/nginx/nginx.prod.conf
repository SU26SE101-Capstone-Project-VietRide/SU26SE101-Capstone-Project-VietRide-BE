# VietRide production Nginx — INTERNAL reverse proxy behind Cloudflare Tunnel.
#
# TLS is terminated at Cloudflare's edge (HTTPS on api.vietride.app:443). cloudflared
# forwards plain HTTP to this nginx (nginx:80), so there is NO ssl/cert config here.
# nginx only does path routing inside the docker network. No host port is published.
#
# Routing:
#   /v1/        → gateway (backend API)
#   /tracking/  → tracking WebSocket (enable when tracking is deployed)
#   /           → frontend (enable when FE is deployed on this server)

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 20m;

  # Standard proxy headers. Cloudflare sets the real client IP in CF-Connecting-IP.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Docker's embedded DNS. Using it + a variable in proxy_pass forces nginx to RE-RESOLVE
  # the gateway hostname per request, so a redeployed gateway (new container IP) is picked
  # up without restarting nginx. A static `upstream{}` would cache the IP at startup and
  # 502 after every gateway redeploy.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    # Healthcheck for the docker healthcheck + Cloudflare origin check.
    location = /health {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # Backend API → gateway (re-resolved each request via $gateway variable).
    location /v1/ {
      set $gateway http://gateway:3000;
      proxy_pass $gateway;
    }

    # Deep-link endpoints — gateway serves these on the APEX domain
    # (vietride.online → this nginx via the tunnel). assetlinks.json must be
    # 200 + raw JSON + no redirect for Android App Links verification.
    location /.well-known/ {
      set $gateway http://gateway:3000;
      proxy_pass $gateway;
    }
    location = /auth/set-password {
      set $gateway http://gateway:3000;
      proxy_pass $gateway;
    }

    # Swagger aggregator UI (/docs) + per-service OpenAPI specs (/api-specs/*) — gateway.
    location /docs {
      set $gateway http://gateway:3000;
      proxy_pass $gateway;
    }
    location /api-specs/ {
      set $gateway http://gateway:3000;
      proxy_pass $gateway;
    }

    # WebSocket (tracking) — bypasses the gateway per BSOT §3.4.1.
    # Uses a variable ($tracking) so nginx re-resolves the tracking hostname on every
    # request via Docker's embedded DNS (127.0.0.11), just like $gateway above.
    location /tracking/socket.io/ {
      set $tracking http://tracking:3001;
      proxy_pass $tracking;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # Frontend (single-port setup: "/" serves the FE). Choose ONE when FE is ready:
    #   (a) FE container in this compose:   location / { proxy_pass http://frontend; }
    #   (b) FE static build mounted into nginx: root /usr/share/nginx/html; try_files ...
    # Until then, the root returns a placeholder so the tunnel has something to answer.
    location / {
      return 200 "VietRide API edge. Backend at /v1/.\n";
      add_header Content-Type text/plain;
    }
  }
}
