# VietRide production Nginx — INTERNAL reverse proxy behind Cloudflare Tunnel.
#
# TLS is terminated at Cloudflare's edge (HTTPS on api.vietride.app:443). cloudflared
# forwards plain HTTP to this nginx (nginx:80), so there is NO ssl/cert config here.
# nginx only does path routing inside the docker network. No host port is published.
#
# Routing:
#   /v1/        → gateway (backend API)
#   /tracking/  → tracking WebSocket (enable when tracking is deployed)
#   /           → frontend (enable when FE is deployed on this server)

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 20m;

  # Standard proxy headers. Cloudflare sets the real client IP in CF-Connecting-IP.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  upstream gateway  { server gateway:3000; }
  # upstream tracking { server tracking:3001; }   # enable when tracking is deployed
  # upstream frontend { server frontend:80; }     # enable when FE container is added

  server {
    listen 80;
    server_name _;

    # Healthcheck for the docker healthcheck + Cloudflare origin check.
    location = /health {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # Backend API → gateway.
    location /v1/ {
      proxy_pass http://gateway;
    }

    # Swagger aggregator UI (/docs) + per-service OpenAPI specs (/api-specs/*) — gateway.
    location /docs {
      proxy_pass http://gateway;
    }
    location /api-specs/ {
      proxy_pass http://gateway;
    }

    # WebSocket (tracking) — bypasses the gateway per BSOT §3.4.1.
    # location /tracking/socket.io/ {
    #   proxy_pass http://tracking;
    #   proxy_http_version 1.1;
    #   proxy_set_header Upgrade $http_upgrade;
    #   proxy_set_header Connection "upgrade";
    # }

    # Frontend (single-port setup: "/" serves the FE). Choose ONE when FE is ready:
    #   (a) FE container in this compose:   location / { proxy_pass http://frontend; }
    #   (b) FE static build mounted into nginx: root /usr/share/nginx/html; try_files ...
    # Until then, the root returns a placeholder so the tunnel has something to answer.
    location / {
      return 200 "VietRide API edge. Backend at /v1/.\n";
      add_header Content-Type text/plain;
    }
  }
}
