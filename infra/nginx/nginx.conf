# VietRide Nginx — placeholder.
# Role per BACKEND_SOURCE_OF_TRUTH 3.4.1 + 11.6:
#   - SSL termination (HTTPS → upstream plain HTTP within Docker network)
#   - Reverse proxy /v1/* → gateway:3000
#   - Direct WebSocket route /tracking/socket.io/* → tracking:3001 (bypass gateway)
#   - VNPay IPN IP whitelist
# Filled in Day 2+ when app containers run. Day 1 keeps placeholder skeleton only.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # upstream gateway   { server gateway:3000; }
  # upstream tracking  { server tracking:3001; }

  server {
    listen 80;
    server_name _;

    location /health {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # location /v1/ { proxy_pass http://gateway; }
    # location /tracking/socket.io/ {
    #   proxy_pass http://tracking;
    #   proxy_http_version 1.1;
    #   proxy_set_header Upgrade $http_upgrade;
    #   proxy_set_header Connection "upgrade";
    # }
  }
}
