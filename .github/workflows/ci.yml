name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DOTNET_VERSION: '8.0.421'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  lint:
    name: Lint (TypeScript / NestJS)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma Clients
        run: |
          for schema in apps/*/prisma/schema.prisma; do
            if [ -f "$schema" ]; then
              npx prisma generate --schema="$schema"
            fi
          done

      - name: Lint all projects (TypeScript / NestJS only — .NET format runs in build-dotnet job)
        run: npx nx run-many --target=lint --all --parallel=3 --exclude="VietRide.*"

  test-ts:
    name: Test (TypeScript / NestJS)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma Clients
        run: |
          for schema in apps/*/prisma/schema.prisma; do
            if [ -f "$schema" ]; then
              npx prisma generate --schema="$schema"
            fi
          done

      - name: Run tests (TypeScript / NestJS only — .NET tests run in build-dotnet job)
        run: npx nx run-many --target=test --all --parallel=3 --exclude="VietRide.*" --ci --passWithNoTests

  build-ts:
    name: Build (TypeScript / NestJS)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma Clients
        run: |
          for schema in apps/*/prisma/schema.prisma; do
            if [ -f "$schema" ]; then
              npx prisma generate --schema="$schema"
            fi
          done

      - name: Build all projects (TypeScript / NestJS only — .NET builds in build-dotnet job)
        run: npx nx run-many --target=build --all --parallel=3 --exclude="VietRide.*"

  build-dotnet:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest
    env:
      # .NET integration tests create throwaway databases on localhost.
      VIETRIDE_IDENTITY_TEST_CONNECTION_STRING: 'Host=localhost;Port=5432;Database=vietride_identity_tests;Username=postgres;Password=postgres'
      VIETRIDE_BOOKING_TEST_CONNECTION_STRING: 'Host=localhost;Port=5432;Database=vietride_booking_tests;Username=postgres;Password=postgres'
      VIETRIDE_PARCEL_TEST_CONNECTION_STRING: 'Host=localhost;Port=5432;Database={databaseName};Username=postgres;Password=postgres'
      VIETRIDE_PAYMENT_TEST_CONNECTION_STRING: 'Host=localhost;Port=5432;Database={databaseName};Username=postgres;Password=postgres'
      VIETRIDE_TRIP_TEST_CONNECTION_STRING: 'Host=localhost;Port=5432;Database={databaseName};Username=postgres;Password=postgres'
      VIETRIDE_PERSISTENCE_TEST_CONNECTION_STRING: 'Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres'
      REDIS_URL: 'localhost:6379,abortConnect=false'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        solution:
          - libs/dotnet/VietRide.Libs.sln
          - apps/identity/VietRide.Identity.sln
          - apps/trip/VietRide.Trip.sln
          - apps/booking/VietRide.Booking.sln
          - apps/payment/VietRide.Payment.sln
          - apps/parcel/VietRide.Parcel.sln
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ matrix.solution }}

      - name: Build
        run: dotnet build ${{ matrix.solution }} --no-restore --configuration Release

      - name: Format check (.NET lint)
        run: dotnet format ${{ matrix.solution }} --verify-no-changes --no-restore --verbosity minimal

      - name: Test
        run: dotnet test ${{ matrix.solution }} --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results-${{ strategy.job-index }}
          path: ./TestResults
          if-no-files-found: ignore
