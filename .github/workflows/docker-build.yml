name: Docker Build & Push

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Override tag (default: workflow ref)"
        required: false
        type: string
  # Callable by release.yml so the auto-release pipeline reuses this exact build
  # matrix instead of duplicating it.
  workflow_call:
    inputs:
      tag:
        description: "Version tag to build (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/vietride

jobs:
  build-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity
            dockerfile: apps/identity/Dockerfile
          - service: trip
            dockerfile: apps/trip/Dockerfile
          - service: booking
            dockerfile: apps/booking/Dockerfile
          - service: payment
            dockerfile: apps/payment/Dockerfile
          - service: parcel
            dockerfile: apps/parcel/Dockerfile
          - service: gateway
            dockerfile: apps/gateway/Dockerfile
          - service: tracking
            dockerfile: apps/tracking/Dockerfile
          - service: notification
            dockerfile: apps/notification/Dockerfile
          - service: rag
            dockerfile: apps/rag/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version tag
        id: vars
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev"
          fi
          SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "full_tag=${VERSION}+${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.service }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=${{ steps.vars.outputs.version }}-${{ steps.vars.outputs.sha_short }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v') }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false
