name: Release (auto)

# Fully automated release pipeline:
#   push to main → CI runs → (this) → compute version → tag → build images → deploy → health check
#
# The trigger is workflow_run on CI completion, NOT a raw push. That is the safety gate:
# if CI fails, this workflow's jobs are skipped and nothing ships. A green CI is necessary
# but not sufficient (CI runs against an empty test DB and mocked hosts) — that is why the
# deploy step still health-checks the live domain and why the manual deploy.yml stays as the
# one-click rollback path (re-run it with any previous tag).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write # push the version tag
  packages: write # build job pushes images to GHCR

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    name: Compute + push version tag
    # Only release if the CI run we are reacting to actually succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Tag the exact commit CI validated, not whatever is newest on main.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute next semver from Conventional Commits
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # feat → minor, fix → patch, feat!/"BREAKING CHANGE" → major.
          # Anything else still ships a patch so every merge produces a release.
          default_bump: patch
          tag_prefix: v

  build:
    name: Build images
    needs: version
    if: ${{ needs.version.outputs.new_tag != '' }}
    uses: ./.github/workflows/docker-build.yml
    with:
      tag: ${{ needs.version.outputs.new_tag }}
    secrets: inherit

  deploy:
    name: Deploy to production
    needs: [version, build]
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.version.outputs.new_tag }}
    secrets: inherit
