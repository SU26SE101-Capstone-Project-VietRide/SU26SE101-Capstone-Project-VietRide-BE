[mcp_servers.codegraph]
command = "cmd"
args = [
    "/c",
    "codegraph",
    "serve",
    "--mcp",
]

[mcp_servers.codegraph.tools.codegraph_node]
approval_mode = "approve"

[mcp_servers.codegraph.tools.codegraph_context]
approval_mode = "approve"

[mcp_servers.context7]
command = "cmd"
args = [
    "/c",
    "npx",
    "-y",
    "@upstash/context7-mcp",
]
